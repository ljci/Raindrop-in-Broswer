name: Release

# Fully automatic: bump "version" in manifest.json and push to main.
# If no release exists for that version yet, CI builds the extension zip,
# creates the tag vX.Y.Z and publishes the release with the zip attached.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: |
          VERSION=$(jq -r .version manifest.json)
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          echo "ZIP=raindrop-quick-links-v${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the version in manifest.json to publish a new one."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build extension zip
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p dist/raindrop-quick-links
          cp -r manifest.json api.js popup.html popup.js options.html options.js style.css icons README.md dist/raindrop-quick-links/
          (cd dist && python3 -m zipfile -c "${GITHUB_WORKSPACE}/${ZIP}" raindrop-quick-links)
          test -s "$ZIP" && python3 -m zipfile -l "$ZIP"

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --notes "Download **${ZIP}** below, unzip it to a folder you'll keep, open chrome://extensions, turn on Developer mode, click **Load unpacked**, and pick the unzipped folder. Setup steps are in the README."
