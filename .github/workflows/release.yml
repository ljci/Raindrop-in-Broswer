name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          NAME="raindrop-quick-links-${GITHUB_REF_NAME}"
          mkdir -p dist/raindrop-quick-links
          cp -r manifest.json api.js popup.html popup.js options.html options.js style.css icons README.md dist/raindrop-quick-links/
          (cd dist && zip -r "../${NAME}.zip" raindrop-quick-links)
          echo "ZIP=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "$GITHUB_REF_NAME" \
            --notes "Download **${ZIP}**, unzip it to a folder you'll keep, open chrome://extensions, turn on Developer mode, click **Load unpacked**, and pick the unzipped folder. Setup steps are in the README."
