name: Release

# Publish a release on GitHub (or push a v* tag) and this attaches the
# ready-to-install extension zip to it.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          NAME="raindrop-quick-links-${TAG}"
          mkdir -p dist/raindrop-quick-links
          cp -r manifest.json api.js popup.html popup.js options.html options.js style.css icons README.md dist/raindrop-quick-links/
          (cd dist && zip -r "../${NAME}.zip" raindrop-quick-links)
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "ZIP=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Attach zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Download **${ZIP}**, unzip it to a folder you'll keep, open chrome://extensions, turn on Developer mode, click **Load unpacked**, and pick the unzipped folder. Setup steps are in the README."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes "$NOTES"
          fi
